[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grab-dl"
dynamic = ["version"]
description = "Lean download manager: an aria2 engine in a terminal app, a CLI, and a Chromium extension"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sina Soleimanipour" }]
keywords = ["download-manager", "aria2", "tui", "textual", "omarchy", "chromium-extension"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["textual>=8.0", "rich>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/Siriko404/grab"
Issues = "https://github.com/Siriko404/grab/issues"
Changelog = "https://github.com/Siriko404/grab/blob/main/CHANGELOG.md"

[project.scripts]
grab = "grab.cli:main"
grab-host = "grab.host:main"

[tool.setuptools.dynamic]
version = { attr = "grab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grab = ["extension/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: drives a real headless Chromium with the extension loaded (needs node, chromium)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
